name: Release

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      snapshot:
        description: "Create snapshot release"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  snapshot:
    name: Snapshot Release
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.snapshot == 'true' }}
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
          registry-url: "https://registry.npmjs.org/"

      - name: Upgrade npm for OIDC support
        run: npm install -g npm@latest

      - name: Install Dependencies
        run: pnpm i --frozen-lockfile

      - name: 🔨 Build
        run: pnpm build

      - name: Publish snapshot to NPM
        run: |
          pnpm changeset version --snapshot snapshot
          pnpm changeset publish --tag snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: "" # https://github.com/changesets/changesets/issues/1152#issuecomment-3190884868

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.snapshot != 'true' }}
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
          registry-url: "https://registry.npmjs.org/"

      - name: Upgrade npm for OIDC support
        run: npm install -g npm@latest

      - name: Install Dependencies
        run: pnpm i --frozen-lockfile

      - name: 🔨 Build
        run: pnpm build

      - name: Create Release PR or Publish to NPM
        id: changesets
        uses: opengovsg/changesets-action@f68bb4b781c954856eabd2643d4087c8faa97f2a
        with:
          version: pnpm version-packages
          publish: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: "" # https://github.com/changesets/changesets/issues/1152#issuecomment-3190884868
