name: Release

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      snapshot:
        description: "Create snapshot release"
        type: boolean
        default: false
      packages:
        description: "Packages to snapshot (npm name or dir, comma/space separated). Leave empty for all packages with a changeset."
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  snapshot:
    name: Snapshot Release
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.snapshot == 'true' }}
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
          registry-url: "https://registry.npmjs.org/"

      - name: Upgrade npm for OIDC support
        # npm@12 ships a broken bundle that can't resolve `sigstore`, breaking
        # `npm publish --provenance`. Stay on 11.x (>=11.5.1 supports OIDC).
        run: npm install -g npm@^11

      - name: Install Dependencies
        run: pnpm i --frozen-lockfile

      - name: 🔨 Build
        run: pnpm build

      # When specific packages are requested, snapshot-version only those by
      # passing `--ignore` for every other publishable workspace package.
      # `changeset publish` then only publishes the packages that received a
      # snapshot version. Empty input => snapshot all packages with changesets.
      - name: Resolve snapshot scope
        id: scope
        env:
          PACKAGES: ${{ github.event.inputs.packages }}
        run: |
          node .github/scripts/snapshot-ignore.js >> "$GITHUB_OUTPUT"

      - name: Publish snapshot to NPM
        run: |
          pnpm changeset version --snapshot snapshot ${{ steps.scope.outputs.ignore_args }}
          pnpm changeset publish --tag snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: "" # https://github.com/changesets/changesets/issues/1152#issuecomment-3190884868

      - name: Configure registry for GitHub Packages
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://npm.pkg.github.com"

      - name: Publish snapshot to GitHub Packages
        run: .github/scripts/publish-github-packages.sh snapshot
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.snapshot != 'true' }}
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      packages: write
    steps:
      # Mint a token from the reusable Changesets GitHub App so the Version
      # Packages PR is created with a non-default identity. PRs/pushes made
      # with the default GITHUB_TOKEN do NOT trigger workflows, so required
      # checks (e.g. "Run tests") would never run on the release PR; an App
      # token avoids that. See actions/create-github-app-token.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.OGP_CHANGESETS_CLIENT_ID }}
          private-key: ${{ secrets.OGP_CHANGESETS_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
          registry-url: "https://registry.npmjs.org/"

      - name: Upgrade npm for OIDC support
        # npm@12 ships a broken bundle that can't resolve `sigstore`, breaking
        # `npm publish --provenance`. Stay on 11.x (>=11.5.1 supports OIDC).
        run: npm install -g npm@^11

      - name: Install Dependencies
        run: pnpm i --frozen-lockfile

      - name: 🔨 Build
        run: pnpm build

      - name: Create Release PR or Publish to NPM
        id: changesets
        uses: opengovsg/changesets-action@f68bb4b781c954856eabd2643d4087c8faa97f2a
        with:
          version: pnpm version-packages
          publish: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_TOKEN: "" # https://github.com/changesets/changesets/issues/1152#issuecomment-3190884868

      - name: Configure registry for GitHub Packages
        if: steps.changesets.outputs.published == 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://npm.pkg.github.com"

      - name: Publish to GitHub Packages
        if: steps.changesets.outputs.published == 'true'
        run: .github/scripts/publish-github-packages.sh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
